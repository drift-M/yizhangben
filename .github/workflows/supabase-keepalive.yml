# Supabase 保活任务
#
# Supabase 免费版项目 7 天没有任何 API 请求会被自动暂停（暂停后网站报 Failed to fetch）。
# 本工作流每天定时请求一次 Supabase REST 接口，让平台判定项目"活跃"，避免自动暂停。
#
# 说明：
# - cron 使用 UTC 时间，2:30 UTC = 北京时间 10:30
# - 复用 deploy.yml 已配置的 Secrets：VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
# - 仅查询 1 条商品记录，几乎不消耗数据库额度
# - 注意：GitHub 会在仓库 60 天无任何活动时自动停用定时工作流，
#   届时到 Actions 页面手动启用一次即可（或随便 push 一次代码）。

name: Supabase Keepalive

on:
  schedule:
    - cron: '30 2 * * *' # 每天北京时间 10:30 执行
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: supabase-keepalive

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 请求 Supabase REST 接口保活
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # 向 REST 接口发送带 anon 密钥的真实请求（401/200 都算平台活跃）
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase 响应状态码: ${STATUS}"
          if [ "${STATUS}" = "000" ]; then
            echo "::warning::无法连接 Supabase，请检查项目是否已被暂停"
          fi
